# Brante-Save-Load - Doorstop configuration
# This file and winhttp.dll go into the GAME FOLDER (next to the .exe).
# tools/install.sh installs both; nothing here touches the game's own files.
[General]
enabled=true
# Path is relative to the game folder. Brante-Save-Load/ is the symlink (or
# copy) of the repo's folder of the same name.
target_assembly=Brante-Save-Load/Brante-Save-Load.dll
redirect_output_log=false
boot_config_override=
ignore_disable_switch=false

[UnityMono]
# Let Mono find 0Harmony.dll (and anything else the mod ships) inside the
# mod folder. The game's own Managed folder stays the primary search path.
dll_search_path_override=Brante-Save-Load
debug_enabled=false
debug_address=127.0.0.1:10000
debug_suspend=false

[Il2Cpp]
coreclr_path=
corlib_dir=
